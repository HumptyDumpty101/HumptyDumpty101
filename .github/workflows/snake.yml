name: Generate Snake

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: HumptyDumpty101
          outputs: |
            images/v2/snake.svg?palette=github-dark&color_snake=cba6f7&color_dots=#1e1e2e,#313244,#7287fd,#b4befe,#cba6f7

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/v2/snake.svg
          git diff --staged --quiet || git commit -m "chore: update snake contribution graph"
          git push
